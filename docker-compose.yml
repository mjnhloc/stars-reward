services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5433:5432"]
    volumes: [postgres_data:/var/lib/postgresql]
    healthcheck:
      test: 
        - CMD-SHELL
        - pg_isready -h localhost -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_SECURITY_ENABLED: "false"
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8081
      # JWT_ISSUER_URI: ${JWT_ISSUER_URI}
      # JWT_JWK_SET_URI: ${JWT_JWK_SET_URI}
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
  frontend:
    build:
      context: ./frontend
      args: { VITE_API_URL: http://localhost:8080/api/v1 }
    ports: ["8081:80"]
    depends_on: [backend]
volumes:
  postgres_data:
