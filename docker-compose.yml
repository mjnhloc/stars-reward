services:
    db:
        image: postgres:18-alpine
        container_name: stars-reward-postgres
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports: ["5433:5432"]
        volumes: [postgres_data:/var/lib/postgresql]
        healthcheck:
            test:
                - CMD-SHELL
                - pg_isready -h localhost -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}
            interval: 5s
            timeout: 3s
            retries: 20
        networks:
            - stars-reward-network

    redis:
        image: redis:8-alpine
        container_name: stars-reward-redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        command:
            - redis-server
            - --appendonly
            - "yes"
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            interval: 5s
            timeout: 3s
            retries: 20
        networks:
            - stars-reward-network

    backend:
        build: ./backend
        container_name: stars-reward-backend
        environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
            SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
            SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
            SPRING_DATA_REDIS_HOST: redis
            SPRING_DATA_REDIS_PORT: 6379
            APP_SECURITY_ENABLED: "false"
            APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
            JWT_SECRET: ${JWT_SECRET}
        ports: ["8080:8080"]
        depends_on:
            db: { condition: service_healthy }
            redis: { condition: service_healthy }
        networks:
            - stars-reward-network

    frontend:
        build:
            context: ./frontend
            args:
                VITE_API_URL: /api/v1
        container_name: stars-reward-frontend
        ports: ["5173:80"]
        depends_on: [backend]
        networks:
            - stars-reward-network

volumes:
    postgres_data:
        name: stars-reward-postgres-data

    redis_data:
        name: stars-reward-redis-data

networks:
    stars-reward-network:
        name: stars-reward-network
