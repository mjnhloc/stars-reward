spring:
    config:
        import:
            - file:../.env[.properties]
    application.name: stars-reward-backend
    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/${POSTGRES_DB}}
        username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER}}
        password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
        hikari:
            maximum-pool-size: 20
            minimum-idle: 2
            connection-timeout: 30000
    flyway:
        enabled: true
    jackson:
        time-zone: Asia/Ho_Chi_Minh
server:
    port: 8080
    shutdown: graceful
management:
    endpoints:
        web:
            exposure:
                include: health,info,metrics,prometheus
    endpoint:
        health:
            probes:
                enabled: true
app:
    security:
        enabled: ${APP_SECURITY_ENABLED:false}
        jwt:
            access-token-expiration-seconds: 3600
            issuer: stars-reward
            secret: ${JWT_SECRET}
    cors:
        allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
    rewards:
        stars-per-redemption: 10
        vnd-per-redemption: 50000
